name: Automotive HMI Test Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-automation:
    name: Execute HMI Automated Test Suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python & Robot Framework Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Cross-Platform HMI Test Automation
        run: |
          node run_tests.js

      - name: Run Python Diagnostic & Failure Tests
        run: |
          python run_tests.py || true

      - name: Archive Test Execution Report Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hmi-test-execution-reports
          path: |
            test_execution_report.html
            generated_jira_defect.md
            artifacts/
